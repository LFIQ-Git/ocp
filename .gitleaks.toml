title = "OCP gitleaks configuration"

# ── THIS BLOCK IS LOAD-BEARING ────────────────────────────────────────────────
# A gitleaks config REPLACES the default ruleset; it does not add to it. Without
# `useDefault` this file declares an allowlist and NO rules, so gitleaks loads
# zero rules and reports "no leaks found" against anything you hand it — the scan
# passes because nothing can ever match, not because the tree is clean.
#
# Measured, not reasoned about (gitleaks 8.30.1, planted AWS key + GitHub PAT +
# Slack token + RSA private key in a scratch dir):
#   with this file, without [extend] ... 0 findings
#   gitleaks defaults, no --config ..... 3 findings
#   this file WITH [extend] ............ 3 findings
# The CI job's own header says "public repo, no tolerance"; for however long this
# file has existed without this block, the gate enforced nothing. The workflow
# runs a positive control after the real scan so this cannot silently regress.
[extend]
useDefault = true

[allowlist]
description = "OCP known-safe allowlist"
regexes = [
  # Public OAuth client ID for Claude Code PKCE flow (constant, not a secret)
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
  # OCP README API key placeholder example
  '''ocp_(example|XXX+|xxxx+)''',
]
paths = [
  # Old plan doc with test-admin-123 placeholders. The `shipped/` segment is
  # optional because the doc was moved after this entry was written, which
  # silently un-allowlisted it — the two curl-auth-header hits it produces are
  # the literal string `test-admin-123`.
  '''docs/superpowers/plans/(shipped/)?2026-04-10-lan-mode\.md''',
]
commits = [
  # Historical README blocks illustrating `ocp keys add` terminal output, whose
  # sample `ocp_…` value is shaped like a real key and so trips generic-api-key.
  # Allowlisted by commit rather than by value: the value is not worth copying
  # into this file, and these two commits are immutable history — the lines are
  # long gone from README.md on main.
  "087e26346fcdc12c7a4a72ebdcabb64c801a162c",
  "cc745aa5d910fce918619d531eb901a65ca9dfc0",
]
